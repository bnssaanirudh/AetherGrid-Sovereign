apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethergrid-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aethergrid-backend
  template:
    metadata:
      labels:
        app: aethergrid-backend
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: backend
          image: aethergrid-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aethergrid-backend
spec:
  selector:
    app: aethergrid-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
