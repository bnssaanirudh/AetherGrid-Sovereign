apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethergrid-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aethergrid-frontend
  template:
    metadata:
      labels:
        app: aethergrid-frontend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: aethergrid-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://aethergrid-backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: aethergrid-frontend
spec:
  type: NodePort
  selector:
    app: aethergrid-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000
