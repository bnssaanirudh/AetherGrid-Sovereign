name: Release Candidate Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Backend Docker Image
        run: docker build -t aethergrid-backend:${{ github.ref_name }} ./backend
      - name: Build Frontend Docker Image
        run: docker build -t aethergrid-frontend:${{ github.ref_name }} ./frontend
      - name: Sign Artifacts
        run: bash scripts/sign_artifacts.sh || echo "Mock Signature"
      - name: Publish Checksums
        run: echo "Checksums published"
