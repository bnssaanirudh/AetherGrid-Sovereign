name: Security Scans

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2AM UTC
  push:
    branches: [ main ]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Bandit (Python SAST)
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r packages backend -ll -ii
        
  sbom-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate SBOM (Mock via bash script)
        run: bash scripts/generate_sboms.sh || echo "SBOM script not yet implemented"
